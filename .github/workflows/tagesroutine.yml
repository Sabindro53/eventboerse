name: Tagesroutine

# Haelt zwei erzeugte Dateien frisch und committet sie nach main, wenn sich
# etwas geaendert hat. Der Push loest den normalen IONOS-Deploy aus.
#
#   assets/eb-demo-feed.json   frische Demo-Beitraege (scripts/demo-feed.mjs)
#   audit/latest.json          Selbstcheck (scripts/self-audit.mjs)
#
# Warum der Selbstcheck dazugehoert: er lag zuletzt zwei Wochen still und
# meldete "Keine automatisierten Tests", waehrend die Playwright-Suite laengst
# stand. Ein Befund ueber einen alten Code-Stand ist schlimmer als keiner —
# man handelt danach.
#
# Geliefert wird ueber einen Pull Request, nicht direkt auf main: ein
# Repository-Ruleset verlangt "Changes must be made through a pull request".
# Der Zweig gehoert genau einem Lauf (Datum + Lauf-ID + Versuch), damit sich
# zwei Laeufe desselben Tages nicht gegenseitig blockieren.
#
# Sicherheitsnetz: Schlaegt die Pruefung fehl, wird NICHT committet.

on:
  schedule:
    # Taeglich 03:17 UTC — bewusst nicht zur vollen Stunde.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write   # die Routine liefert ueber einen PR, nicht direkt auf main

concurrency:
  group: tagesroutine
  cancel-in-progress: false

jobs:
  feed:
    name: Demo-Feed und Selbstcheck erneuern
    runs-on: ubuntu-latest
    env:
      # Der `secrets`-Kontext ist in `steps.*.if` nicht verfuegbar, in
      # `jobs.<id>.env` aber schon — deshalb der Umweg ueber einen Merker.
      HAT_APP: ${{ secrets.EB_ROUTINE_APP_ID != '' }}
    steps:
      # Token der GitHub App holen.
      #
      # Warum nicht GITHUB_TOKEN: ein damit angelegter PR loest keine
      # Workflow-Laeufe aus. Die im Ruleset geforderte PR-Validierung liefe
      # nie an, und der PR bliebe fuer immer offen stehen. Ein
      # Installations-Token einer App loest die Pruefungen dagegen normal aus.
      #
      # Warum eine App statt eines PAT: kein Ablaufdatum, eigene Identitaet
      # (die PRs haengen nicht an einem persoenlichen Konto), und die Rechte
      # sind an die Installation gebunden statt an einen Menschen.
      - name: Routine-Token beschaffen
        id: apptoken
        if: env.HAT_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.EB_ROUTINE_APP_ID }}
          private-key: ${{ secrets.EB_ROUTINE_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Der Push laeuft unter diesem Token. Ohne eingerichtete App faellt
          # es auf GITHUB_TOKEN zurueck — dann wird der PR zwar angelegt, kann
          # aber nicht mergen. Das steht dann ausdruecklich in der
          # Zusammenfassung, statt still zu passieren.
          token: ${{ steps.apptoken.outputs.token || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Feed erzeugen
        run: node scripts/demo-feed.mjs

      - name: Ehrlichkeit + Reproduzierbarkeit pruefen
        run: node scripts/demo-feed.mjs --check

      - name: Selbstcheck erneuern
        run: node scripts/self-audit.mjs

      # Rechtliche Lage: taeglich messen, nicht nur bei einem PR. Ein Befund
      # wie "die Einwilligung wird erhoben und von niemandem gelesen" aendert
      # sich auch dann, wenn niemand einen PR aufmacht — etwa weil ein Modul
      # umgebaut wurde. Die Notiz wird mitcommittet, damit im HQ der gemessene
      # Stand steht und nicht der von Mai.
      #
      # Bewusst OHNE --check: die Routine soll den Zustand festhalten, nicht
      # nachts rot werden. Blockiert wird im PR-Check, wo jemand zusieht.
      - name: Rechtliche Lage messen
        run: node scripts/recht.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # ── Die Schichten der KI-Mitarbeiter ───────────────────────────────
      # Ohne OPENROUTER_API_KEY laufen sie durch, notieren den Ausfall im
      # Journal und enden mit 0. Eine Routine soll nicht rot werden, weil ein
      # optionaler Schluessel fehlt — aber auch nicht so tun, als haette
      # jemand gearbeitet.
      # Der Abbruchpfad war nicht abgedeckt: bricht eine Schicht ab (Exit 1),
      # riss sie bis hierher den ganzen Lauf mit — und weil der Commit erst
      # DANACH kommt, blieben Demo-Feed und Selbstcheck ungespeichert. Genau so
      # sind die Dateien sieben bis zehn Tage alt geworden, obwohl beide
      # Generatoren jede Nacht sauber durchliefen.
      #
      # Der Abbruch verschwindet dadurch nicht: agent.mjs schreibt ihn ins
      # Journal, und das Journal wird mitcommittet. Sichtbar bleibt er also —
      # nur nimmt er die Arbeit der Routine nicht mehr mit runter.
      - name: Lagemelder — Betriebszustand zusammenfassen
        env:
          OPENROUTER_API_KEY: ${{ secrets.EB_OPENROUTER_API_KEY }}
        run: |
          node scripts/lage.mjs > /tmp/lage.txt
          node scripts/agent.mjs --rolle mistral-ops --kontext /tmp/lage.txt --anlass "Tagesroutine" \
            || echo "⚠️ Lagemelder abgebrochen — steht im Journal, Routine laeuft weiter." >> "$GITHUB_STEP_SUMMARY"

      - name: Sortierer — offene Wissensluecken ordnen
        env:
          OPENROUTER_API_KEY: ${{ secrets.EB_OPENROUTER_API_KEY }}
        run: |
          L=vault/50-Evolution/AI-Gedaechtnis/Wissensluecken.md
          if [ -f "$L" ]; then
            node scripts/agent.mjs --rolle gemma-sort --kontext "$L" --anlass "Tagesroutine" \
              || echo "⚠️ Sortierer abgebrochen — steht im Journal, Routine laeuft weiter." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Keine Wissensluecken-Liste — der Sortierer hat heute nichts zu tun."
          fi

      - name: Arbeitsjournal pruefen
        run: node scripts/agent.mjs --check

      - name: Committen, falls geaendert
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || secrets.GITHUB_TOKEN }}
          HAT_ROUTINE_TOKEN: ${{ steps.apptoken.outputs.token != '' }}
        run: |
          # Eine Liste, zwei Verwendungen. Standen sie doppelt da, erzeugte
          # jede neue Datei eine stille Luecke: gemessen, geschrieben, nie
          # committet — die Routine haette gearbeitet und nichts hinterlassen.
          ERGEBNISSE="assets/eb-demo-feed.json audit/latest.json assets/eb-arbeit.json vault/40-Governance/Legal/Rechtliche-Lage.md"

          if git diff --quiet -- $ERGEBNISSE; then
            echo "Keine Aenderung — Feed, Selbstcheck, Journal und Rechtslage sind aktuell." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "Eventboerse Routine"
          git config user.email "noreply@users.noreply.github.com"
          git add $ERGEBNISSE

          # Ueber einen Pull Request, nicht direkt auf main.
          #
          # Der direkte Push war nie moeglich: ein Repository-Ruleset verlangt
          # "Changes must be made through a pull request". Die alte Schleife
          # verschluckte die Ablehnung, deshalb hat die Routine in ihrer
          # gesamten Laufzeit kein einziges Mal geliefert und trotzdem jedes
          # Mal Erfolg gemeldet.
          #
          # Die Regel wird NICHT umgangen. Ein Zweig pro Lauf, ein PR, und die
          # Pruefungen laufen wie bei jeder anderen Aenderung.
          #
          # Der Zweigname traegt Lauf-ID und Versuch, nicht nur das Datum.
          # Ein Zweig pro Tag klang aufgeraeumter und war der naechste stille
          # Ausfall: der Zweig vom 11:23-Lauf lag noch da (ein Squash-Merge
          # loescht ihn nicht), der 12:26-Lauf traf auf denselben Namen und
          # `--force-with-lease` verweigerte mit "stale info" — der flache
          # Checkout kennt zu diesem Zweig gar keinen Remote-Stand, gegen den
          # er die Zusicherung pruefen koennte. Vier Versuche, 32 Sekunden,
          # Lauf rot. Ein laufeigener Name kann nicht kollidieren, deshalb
          # braucht der Push auch keinen Zwang mehr.
          zweig="routine/tagesstand-$(date -u +%Y-%m-%d)-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$zweig"
          git commit -m "chore(routine): Demo-Feed und Selbstcheck fuer $(date -u +%Y-%m-%d)"

          gepusht=0
          for i in 1 2 3 4; do
            if git push -u origin "$zweig"; then gepusht=1; break; fi
            echo "Push-Versuch $i fehlgeschlagen." >> "$GITHUB_STEP_SUMMARY"
            sleep $((2 ** i))
          done
          if [ "$gepusht" -ne 1 ]; then
            {
              echo "### ⛔ Push des Routine-Zweigs fehlgeschlagen"
              echo "Feed und Selbstcheck wurden erzeugt, sind aber NICHT gespeichert."
              echo "Der genaue Grund steht im Log des letzten Versuchs oben."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Der Zweig gehoert diesem Lauf allein, also kann es zu ihm auch noch
          # keinen PR geben. Scheitert das Anlegen, scheitert der Schritt —
          # ein gepushter Zweig ohne PR waere wieder gespeicherte Arbeit, die
          # niemanden erreicht.
          gh pr create --base main --head "$zweig" \
            --title "chore(routine): Demo-Feed und Selbstcheck fuer $(date -u +%Y-%m-%d)" \
            --body "Erzeugt von der Tagesroutine. Enthaelt ausschliesslich die drei generierten Dateien; beide Generatoren sind reproduzierbar und werden im Lauf geprueft."

          if [ "$HAT_ROUTINE_TOKEN" = "true" ]; then
            # Auto-Merge: der PR faellt zu, sobald die Pruefungen gruen sind,
            # und nimmt seinen Zweig mit — sonst waechst mit jedem Tag ein
            # weiterer toter Zweig nach.
            # Schlaegt es fehl (Auto-Merge im Repo nicht aktiviert), ist das
            # kein roter Lauf — der PR steht dann eben offen und sichtbar da.
            if gh pr merge --squash --auto --delete-branch "$zweig"; then
              echo "PR fuer \`$zweig\` angelegt, Auto-Merge aktiv." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PR fuer \`$zweig\` angelegt. Auto-Merge nicht moeglich — bitte von Hand mergen." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "PR fuer \`$zweig\` angelegt."
              echo ""
              echo "⚠️ **Routine-App nicht eingerichtet.** Der PR wurde mit GITHUB_TOKEN"
              echo "angelegt; damit laufen keine Pruefungen an und er kann nicht mergen."
              echo "Abhilfe: GitHub App anlegen (Contents + Pull requests: Read and write),"
              echo "im Repo installieren und \`EB_ROUTINE_APP_ID\` sowie"
              echo "\`EB_ROUTINE_APP_KEY\` als Secrets hinterlegen."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Tagesroutine gelaufen"
            node -e "const f=require('./assets/eb-demo-feed.json');
              console.log('- Demo-Beitraege: '+f.posts.length);
              console.log('- Aelteste/juengste: '+Math.max(...f.posts.map(p=>p.tageZurueck))+'/'+Math.min(...f.posts.map(p=>p.tageZurueck))+' Tage zurueck');"
            node -e "const a=require('./audit/latest.json'); const c=a.counts||{};
              console.log('- Selbstcheck: '+(a.findings||[]).length+' Befunde (err '+(c.error||0)+', warn '+(c.warn||0)+')');"
          } >> "$GITHUB_STEP_SUMMARY"

      # Fuenf Fehlschlaege in Folge (07.–11.08.) blieben unbemerkt, weil hier
      # nichts meldete. Gleiches Muster wie beim Site-Monitor, andere Marke.
      - name: Ausfall melden
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marke = 'tagesroutine-steht';
            const { data: offen } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: marke, per_page: 5,
            });
            const zeile = `⏰ Erneut fehlgeschlagen: ${new Date().toISOString()} — [Lauf](${process.env.RUN_URL})`;
            if (offen.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: offen[0].number, body: zeile,
              });
              return;
            }
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: marke, color: 'b45309',
                description: 'Automatischer Hinweis: die Tagesroutine laeuft nicht mehr',
              });
            } catch (e) { /* Marke existiert bereits */ }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '⚠️ Tagesroutine faellt aus — Demo-Feed und Selbstcheck veralten',
              labels: [marke],
              body: [
                'Die Tagesroutine ist fehlgeschlagen. Solange das anhaelt, altern `assets/eb-demo-feed.json` und `audit/latest.json` still vor sich hin — das HQ zeigt dann Zahlen von gestern als waeren sie von heute.',
                '',
                `**Lauf:** ${process.env.RUN_URL}`,
                '',
                'Dieses Issue schliesst sich selbst, sobald ein Lauf wieder durchlaeuft.',
              ].join('\n'),
            });

      - name: Ausfall als behoben markieren
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const marke = 'tagesroutine-steht';
            const { data: offen } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: marke, per_page: 5,
            });
            for (const i of offen) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: `✅ Wieder durchgelaufen: ${new Date().toISOString()}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed', state_reason: 'completed',
              });
            }
