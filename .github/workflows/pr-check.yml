name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: PR-Validierung
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP Syntax Check
        run: |
          find . -name "*.php" \
            -not -path "./.git/*" \
            -not -path "./vendor/*" \
            | xargs -I{} php -l {} \
            && echo "✅ Alle PHP-Dateien syntaktisch korrekt"

      - name: Geänderte Dateien anzeigen
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const lines = ['### Geänderte Dateien in diesem PR:', ''];
            if (files.length === 0) {
              lines.push('_Keine Änderungen erkannt._');
            } else {
              for (const f of files) {
                lines.push(`- \`${f.filename}\` (${f.status}, +${f.additions}/-${f.deletions})`);
              }
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');

      - name: PR-Kommentar mit Vorschau-Link
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('🚀 Deploy-Vorschau'));
            const body = `🚀 **Deploy-Vorschau**\n\nNach dem Merge wird automatisch auf [eventbörse.de](https://xn--eventbrse-57a.de) deployed.\n\n✅ PHP-Syntax OK`;
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # ── Blockierendes Test-Gate ─────────────────────────────────────────
  # Playwright-Suite: Smoke (alle Routen), Suche (natürliche Sätze),
  # Gebühren (centgenau, JS↔PHP-Parität), Wissensbasis (Antworten +
  # Leckage-Schutz), CSS-Minify-Regression (Verlaufsschrift).
  # Schlägt ein Test fehl, ist der PR nicht mergebar.
  tests:
    name: E2E-Testsuite (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: app.js ↔ Module Drift-Check
        run: ./build-app-js.sh --check

      - name: Geschütztes HQ-Template prüfen
        run: |
          node scripts/build-protected-hq.mjs
          node scripts/build-protected-hq.mjs --check
          php -l hq-protected.php

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Wissensbasis-Konsistenz prüfen
        run: node scripts/build-knowledge.mjs --check

      # Externer Zufluss: nichts aus der Recherche-Schleuse darf öffentlich
      # sein, jede Notiz nennt ihre Herkunft, Fremdtext bleibt Datenblock.
      - name: Quarantäne-Tor prüfen
        run: node scripts/quarantine.mjs --check

      # Demo-Inhalte dürfen nie frisch wirken (nichts wurde gepostet) und
      # müssen reproduzierbar sein, sonst committet die Tagesroutine umsonst.
      - name: Demo-Feed prüfen
        run: node scripts/demo-feed.mjs --check

      # Connector-Katalog: keine Geheimnisse, keine undeklarierten Fähigkeiten,
      # kein Verbindungszustand — der entsteht nur aus echten Aufrufen.
      - name: Connector-Katalog prüfen
        run: node scripts/connectors.mjs --check

      # Modell-Ensemble: nur offene Gewichte, eindeutige Rollen, jede
      # Autonomie-Grenze begründet, kein Zustand im Katalog.
      - name: Modell-Ensemble prüfen
        run: node scripts/models.mjs --check

      - name: OpenRouter-Guardrails prüfen
        run: node scripts/openrouter-agents.mjs --self-test

      # Arbeitsjournal: nur echte Läufe, keine Zukunftseinträge, keine
      # Geheimnisse, kein "fertig" ohne Ergebnis.
      - name: Arbeitsjournal prüfen
        run: node scripts/agent.mjs --check

      # Der Auftragsstrom reicht Befunde an den Autopiloten weiter. Die
      # gefaehrliche Stelle ist nicht das Finden, sondern das Weiterreichen:
      # ein Auftrag ausserhalb des freigegebenen Rahmens wuerde den Autopiloten
      # auf Backend, Auth oder Zahlungen zeigen.
      - name: Auftragsstrom prüfen
        run: node scripts/auftragsstrom.mjs && node scripts/auftragsstrom.mjs --check

      # Recht: die Cookie-Liste ist eine Aussage gegenueber Nutzern. Ein neuer
      # Speicherschluessel ohne Eintrag ist eine Informationsluecke nach
      # TDDDG 25 / DSGVO Art. 13 — und faellt sonst erst auf, wenn jemand
      # fragt. Blockierend ist nur, was derselbe Commit beheben kann; die
      # wirkungslose Einwilligung wird gemeldet, nicht gesperrt.
      - name: Rechtliche Lage prüfen
        run: node scripts/recht.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rechtsunterlagen und amtliche Quellen prüfen
        run: |
          node scripts/rechtsquellen.mjs --check
          node scripts/rechtsunterlagen.mjs --check

      # Die Icon-Schrift ist auf die benutzten Symbole zugeschnitten. Ein neu
      # eingebautes Icon, das nicht mitgeschnitten wurde, erscheint im Betrieb
      # als leerer Kasten — sichtbar fuer jeden Besucher, unsichtbar fuer
      # jeden anderen Test. Dieses Tor faengt es im PR.
      # Das Repository ist OEFFENTLICH. Der Gitleaks-Workflow, den GitHub als
      # "active" fuehrt, wurde auf einem nie gemergten Zweig eingefuehrt und
      # ist seit dem 05.05.2026 kein einziges Mal gelaufen -- vier Monate
      # scheinbarer Schutz. Dieses Tor laeuft wirklich.
      - name: Keine Zugangsdaten im Quelltext
        run: node scripts/geheimnisse.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Icon-Schrift deckt alle benutzten Symbole
        run: node scripts/icons.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"

      # CLAUDE.md ist das erste, was jede Sitzung liest. Eine falsche Zahl
      # dort kostet mehr als keine, weil sie Vertrauen geniesst — am 22.08.
      # waren vier Angaben veraltet, darunter eine "bekannte Schwaeche", die
      # es laengst nicht mehr gibt.
      - name: Kontext stimmt mit dem Code überein
        run: node scripts/kontext.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Testsuite ausführen
        run: npx playwright test

      # Der Code-Prüfer (Kito Sarr, DeepSeek-V3) liest den Diff gegen. Er
      # kommentiert nur — der PR wird davon nie rot. Ohne Schlüssel läuft der
      # Schritt durch und notiert den Ausfall.
      - name: Code-Prüfer liest den Diff
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.EB_OPENROUTER_API_KEY }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50 || true
          git diff origin/${{ github.base_ref }}...HEAD -- '*.js' '*.php' '*.mjs' > /tmp/diff.txt || true
          if [ ! -s /tmp/diff.txt ]; then
            echo "Kein Code-Diff — nichts gegenzulesen."
            exit 0
          fi
          node scripts/agent.mjs --rolle deepseek-code --kontext /tmp/diff.txt \
            --anlass "PR #${{ github.event.pull_request.number }}" > /tmp/pruefung.txt 2>&1 || true
          cat /tmp/pruefung.txt

      - name: Befund als Kommentar
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let text = '';
            try { text = fs.readFileSync('/tmp/pruefung.txt', 'utf8'); } catch { return; }
            // Ohne Schlüssel steht dort nur die Ausfallmeldung — die muss
            // niemand als PR-Kommentar lesen.
            if (!text.includes('─')) return;
            const body = '## 🔍 Code-Prüfer\n\n' + text.split('─'.repeat(60))[1].trim()
              + '\n\n---\n_Kito Sarr · DeepSeek-V3 · offene Gewichte. Ein Hinweis, kein Gate._';
            const { data: c } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const alt = c.find(x => x.user.type === 'Bot' && x.body.includes('🔍 Code-Prüfer'));
            if (alt) await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: alt.id, body });
            else await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

      - name: Test-Report hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
