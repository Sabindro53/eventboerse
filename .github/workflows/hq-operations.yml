name: HQ Operations Ensemble
run-name: "⚡ HQ-Puls · Aufgabenstrom und Kontingent"

# Alle 30 Minuten.
#
# Vorher viermal taeglich, und das aus gutem Grund: Puls und Autopilot teilten
# sich EIN $0.60-Budget. Der Puls erzeugt LAGEBILDER, der Autopilot erzeugt
# ARBEIT (Patch, Tests, PR) — bei 11 Rollen x 24 Laeufen hatte der Puls das
# Budget aufgebraucht, bevor der Autopilot dazu kam. Dessen Commits (#113-#119)
# liegen alle zwischen 03:07 und 03:23, genau solange das Budget frisch war.
#
# Der Konflikt bestand also nie zwischen Takt und Kosten, sondern zwischen zwei
# Stellen an einem Topf. Getrennte Toepfe loesen ihn: der Puls bekommt $0.50,
# der Autopilot $1.50. Ein belegter Voll-Lauf kostet $0.0036, macht bei 48
# Laeufen rund $0.17 am Tag — knapp ein Drittel des eigenen Topfes. Der
# Autopilot kann davon nichts mehr verlieren.
#
# Warum ueberhaupt haeufiger: ein Lagebild alle sechs Stunden ist aktuell
# genug, aber das HQ zeigt damit die meiste Zeit einen stillstehenden Betrieb —
# und ein Netz, das steht, ist von einem Netz, das ausgefallen ist, nicht zu
# unterscheiden.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # Fehlschlag sichtbar machen (siehe „Ausfall melden" unten)

concurrency:
  group: hq-operations-ensemble
  cancel-in-progress: false

jobs:
  pulse:
    name: Ensemble-Puls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EB_OPENROUTER_API_KEY: ${{ secrets.EB_OPENROUTER_API_KEY }}
      # Eigener Topf fuer den Puls, getrennt vom Autopiloten. $0.50 tragen
      # 48 Voll-Laeufe mit dreifachem Spielraum (ein belegter Voll-Lauf
      # kostete $0.0036 -> rund $0.17/Tag). Der Autopilot behaelt $1.50 und
      # kann davon nichts mehr an den Puls verlieren.
      EB_OPENROUTER_DAILY_BUDGET_USD: '0.50'
      EB_OPENROUTER_MIN_REMAINING_USD: '1.00'
      SFTP_PASS: ${{ secrets.IONOS_FTP_PASSWORD }}
      SFTP_USER: ${{ secrets.IONOS_FTP_USERNAME }}
      SFTP_HOST: ${{ secrets.IONOS_FTP_SERVER }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 40

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensemble-Katalog pruefen
        run: node scripts/models.mjs --check

      # Das Werkzeug wird HIER gebraucht, nicht erst beim Hochladen: die
      # Laufzeitspur wird ueber denselben Weg gelesen, ueber den sie
      # geschrieben wird.
      - name: SFTP-Werkzeug einrichten
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Die Laufzeitspur kommt per SFTP, nicht ueber das offene Netz.
      #
      # Vorher holte dieser Schritt sie per curl von
      # /wp-content/themes/.../assets/eb-arbeit.json — einer Datei, die
      # `eb_hq_zugang_offen()` bewusst NICHT herausgibt: oeffentlich sind nur
      # eb-knowledge.json und eb-demo-feed.json. Der anonyme Abruf konnte
      # also nie eine gueltige Spur liefern, der Schritt brach ab, und weil
      # der Rollen-Schritt kein `if: always()` traegt, wurde er UEBERSPRUNGEN.
      # Ergebnis: seit dem 23.08. hat keine einzige Schicht mehr gearbeitet,
      # bei rund 50 roten Laeufen am Tag.
      #
      # Und der Zustand konnte sich nicht selbst heilen: der Schritt, der
      # eine gueltige Spur hochlaedt, laeuft nur, wenn sich das Journal
      # geaendert hat — was ohne Rollen nie geschieht. Eine Automatik, die
      # ihre eigene Vorbedingung erzeugt und daran scheitert, steht fuer
      # immer.
      #
      # Deshalb ist dieser Schritt jetzt NICHT MEHR TOEDLICH. Ist die Spur
      # nicht lesbar, gilt der Stand aus dem Repository und der Lauf geht
      # weiter — sichtbar vermerkt, nicht still.
      - name: Bestehende Laufzeitspur vorladen
        shell: bash
        run: |
          spur="/public/wp-content/themes/eventboerse/assets/eb-arbeit.json"
          tmp="$(mktemp)"
          geladen=0
          if [ -n "$SFTP_HOST" ] && [ -n "$SFTP_USER" ] && [ -n "$SFTP_PASS" ]; then
            if lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
                 set sftp:auto-confirm yes;
                 set net:timeout 30;
                 set net:max-retries 2;
                 get $spur -o $tmp;
                 bye
               " >/dev/null 2>&1 \
               && jq -e '.version == 1 and (.eintraege | type == "array")' "$tmp" >/dev/null 2>&1; then
              mv "$tmp" assets/eb-arbeit.json
              geladen=1
            fi
          fi
          if [ "$geladen" -eq 1 ]; then
            echo "Laufzeitspur vom Server: $(jq '.eintraege | length' assets/eb-arbeit.json) Eintraege." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # Der Lauf geht weiter — aber nie stillschweigend.
            echo "⚠️ Laufzeitspur nicht lesbar. Es gilt der Stand aus dem Repository; die Schichten arbeiten weiter." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Voll-Ensemble-Puls bestimmen
        id: cadence
        shell: bash
        run: |
          mapfile -t rollen < <(jq -r '.modelle[] | select(.weg == "openrouter") | .id' assets/eb-models.json)
          anzahl="${#rollen[@]}"
          if [ "$anzahl" -lt 1 ]; then
            echo "Keine OpenRouter-Rolle im Katalog." >&2
            exit 1
          fi
          echo "rolle=alle" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Geplanter Voll-Ensemble-Puls: alle $anzahl Rollen arbeiten innerhalb ihrer Quote." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Manueller Voll-Ensemble-Puls: alle $anzahl Rollen arbeiten innerhalb ihrer Quote." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Kontext klein halten — er ist der ganze Verbrauch.
      #
      # Vorher gingen 180 Zeilen aus einer 26-KB-Sprintdatei plus 160 Zeilen
      # Audit an JEDE der 11 Rollen: rund 4200 Prompt-Token pro Rolle, elfmal
      # pro Lauf, 24 Läufe am Tag — gut 1,1 Mio Token taeglich, bei etwa
      # 150 Token Antwort je Rolle. Verhaeltnis 28:1, und das meiste davon war
      # abgeschlossene Historie, die niemand mehr braucht.
      #
      # Jetzt nur der Ist-Stand: der Kopf des Sprints (Abschnitt „Stand heute"),
      # die letzten Commits und die Kurzfassung des Audits. Die Datei-Auszuege
      # zur konkreten Aufgabe kommen ohnehin aus scripts/agent.mjs dazu — DA
      # liegt der Bezug zur Arbeit, nicht in alten Sprintprotokollen.
      - name: Belegten Arbeitskontext bauen
        shell: bash
        run: |
          mkdir -p .ai-run
          {
            echo "LETZTE COMMITS"
            git log -6 --pretty=format:'%h %s'
            echo
            echo "IST-STAND"
            # Nur bis zur naechsten Abschnittsueberschrift — alles danach ist
            # Historie, und ein Modell, das sie als Ist-Stand liest, meldet
            # Zahlen von vorgestern.
            #
            # Bewusst awk statt `sed | head`: GitHub faehrt bash mit
            # `-o pipefail`. Wird der Abschnitt laenger als das Limit, schliesst
            # head die Pipe, sed stirbt an SIGPIPE (141), und der Schritt reisst
            # den Lauf mit. Genau so hat eine gewachsene Sprint-Notiz den Puls
            # lahmgelegt — der Workflow hing still an der Laenge eines Textes.
            awk '/^## Stand heute/ { drin = 1 }
                 drin && /^## Zuletzt/ { exit }
                 drin { print; if (++n >= 24) exit }' \
              vault/50-Evolution/Roadmap/Current-Sprint.md
            echo
            echo "SELBSTCHECK (Kurzfassung)"
            jq -r '{erzeugt, befunde: (.befunde // [] | length),
                    schwer: [(.befunde // [])[] | select(.schwere == "hoch") | .titel]}' \
              audit/latest.json 2>/dev/null || head -c 600 audit/latest.json
          } > .ai-run/ensemble-context.txt
          echo "Kontextgröße: $(wc -c < .ai-run/ensemble-context.txt) Bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Alle Rollen taskweise arbeiten lassen
        shell: bash
        run: |
          if [ "${{ steps.cadence.outputs.rolle }}" = "alle" ]; then
            mapfile -t rollen < <(jq -r '.modelle[] | select(.weg == "openrouter") | .id' assets/eb-models.json)
          else
            rollen=("${{ steps.cadence.outputs.rolle }}")
          fi
          # Jede Rolle einzeln bewerten. Vorher lief die Schleife unter `bash -e`:
          # der erste Exit-Code 1 beendete den ganzen Schritt, und weil
          # mistral-ops an dritter Stelle steht, haben acht Rollen ab dem
          # 10.08. kein einziges Mal gearbeitet. Ein Ausfall im Betrieb darf
          # die Governance-Rolle nicht mit stilllegen.
          gearbeitet=0; gescheitert=0
          for rolle in "${rollen[@]}"; do
            echo "## $rolle" >> "$GITHUB_STEP_SUMMARY"
            if node scripts/agent.mjs \
                 --rolle "$rolle" \
                 --kontext .ai-run/ensemble-context.txt \
                 --anlass "5-Minuten-HQ-Rundlauf" | tee -a "$GITHUB_STEP_SUMMARY"; then
              gearbeitet=$((gearbeitet + 1))
            else
              gescheitert=$((gescheitert + 1))
              echo "⚠️ Rolle \`$rolle\` abgebrochen — Lauf geht weiter." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "ROLLEN_OK=$gearbeitet"   >> "$GITHUB_ENV"
          echo "ROLLEN_FEHL=$gescheitert" >> "$GITHUB_ENV"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bilanz:** $gearbeitet gearbeitet, $gescheitert abgebrochen." >> "$GITHUB_STEP_SUMMARY"
          # Erst am Ende entscheiden: nur ein Totalausfall ist ein roter Lauf.
          # Einzelne Abbrueche stehen im Journal und muessen dort auffallen,
          # nicht als geloeschter Schritt.
          if [ "$gearbeitet" -eq 0 ]; then
            echo "Keine einzige Rolle hat gearbeitet."; exit 1
          fi

      # Ab hier: `if: always()`. Der Fehlerpfad ist genau der Pfad, der
      # bisher geloescht wurde — agent.mjs schreibt den Abbruch korrekt ins
      # Journal, aber ohne diese Zeile lief der Upload nach einem
      # fehlgeschlagenen Schritt nie. Das HQ zeigte darum Ruhe statt Stillstand.
      - name: Journal validieren
        if: always()
        run: node scripts/agent.mjs --check

      # Aus den frischen Befunden die Warteschlange bauen, aus welcher der
      # Autopilot zieht. Ohne diesen Schritt haetten die Rollen weiter
      # gefunden, ohne dass jemand daran arbeitet.
      - name: Auftragsstrom aus den Befunden bauen
        if: always()
        run: |
          node scripts/auftragsstrom.mjs
          node scripts/auftragsstrom.mjs --check
          # Auch nach stdout, nicht nur in die Zusammenfassung: die Summary
          # steht nur im Browser, das Log auch in jeder API und in jedem
          # Werkzeug, das den Lauf spaeter untersucht. Eine Lage, die man nur
          # an einer Stelle sehen kann, sieht man meistens gar nicht.
          node -e "const s=require('./assets/eb-auftragsstrom.json');
            console.log('- Auftragsstrom: '+s.lage);
            console.log('- Ausserhalb des Rahmens: '+s.ausserhalb.length);" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Echte Laufzeitspur veroeffentlichen
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- assets/eb-arbeit.json; then
            echo "Journal unveraendert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASS" ]; then
            echo "SFTP-Zugang fuer die Laufzeitspur fehlt." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Laufzeitdaten gehoeren nicht in die geschuetzte Code-Historie.
          # Diese eine Datei wird in den bereits deployten Theme-Ordner
          # geladen; Code-Deploys lassen sie deshalb bewusst unangetastet.
          # IONOS erlaubt fuer diesen SFTP-Benutzer kein serverseitiges Rename,
          # deshalb wird wie im bewaehrten Theme-Deploy direkt ueberschrieben.
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:timeout 60;
            set net:max-retries 3;
            put assets/eb-arbeit.json -o /public/wp-content/themes/eventboerse/assets/eb-arbeit.json;
            put assets/eb-auftragsstrom.json -o /public/wp-content/themes/eventboerse/assets/eb-auftragsstrom.json;
            bye
          "
          echo "✅ Echte Laufzeitspur direkt im HQ veroeffentlicht." >> "$GITHUB_STEP_SUMMARY"

      # Ohne diesen Schritt bleibt ein Ausfall unsichtbar. Der Site-Monitor legt
      # bei nicht erreichbarer Seite ein Issue an — deshalb wusstest du sofort,
      # wenn eventbörse.de weg war. Fuer die Belegschaft gab es nichts
      # Vergleichbares: elf fehlgeschlagene Laeufe zwischen dem 07. und 11.08.
      # sind niemandem aufgefallen. Eine Automatik, deren Ausfall keiner
      # bemerkt, ist keine Automatik, sondern eine Annahme.
      - name: Ausfall melden
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marke = 'belegschaft-steht';
            const { data: offen } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: marke, per_page: 5,
            });
            const zeile = `⏰ Erneut fehlgeschlagen: ${new Date().toISOString()} — [Lauf](${process.env.RUN_URL})`;
            if (offen.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: offen[0].number, body: zeile,
              });
              return;
            }
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: marke, color: 'b45309',
                description: 'Automatischer Hinweis: eine KI-Schicht laeuft nicht mehr',
              });
            } catch (e) { /* Marke existiert bereits */ }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '⚠️ KI-Schicht faellt aus — Ensemble-Puls fehlgeschlagen',
              labels: [marke],
              body: [
                'Der Ensemble-Puls ist fehlgeschlagen. Bis das behoben ist, arbeitet die Belegschaft nicht.',
                '',
                `**Lauf:** ${process.env.RUN_URL}`,
                '',
                'Haeufigste Ursachen, in der Reihenfolge, in der sie sich pruefen lassen:',
                '1. Eine Aufgaben-Datei enthaelt ein Verbotsmuster → `node scripts/models.mjs --check` zeigt es beim Bauen.',
                '2. `EB_OPENROUTER_API_KEY` fehlt oder das Kontingent ist erschoepft → steht als `uebersprungen` im Journal.',
                '3. Ein Anbieter antwortet nicht → einzelne Rolle `abgebrochen`, der Lauf laeuft weiter.',
                '',
                'Dieses Issue schliesst sich selbst, sobald ein Lauf wieder durchlaeuft.',
              ].join('\n'),
            });

      - name: Ausfall als behoben markieren
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const marke = 'belegschaft-steht';
            const { data: offen } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: marke, per_page: 5,
            });
            for (const i of offen) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: `✅ Wieder durchgelaufen: ${new Date().toISOString()}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed', state_reason: 'completed',
              });
            }
