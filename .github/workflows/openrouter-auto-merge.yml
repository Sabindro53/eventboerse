name: OpenRouter Auto-Merge

# Dieser Workflow laeuft aus dem vertrauenswuerdigen main-Branch. Er reagiert
# ausschliesslich auf einen vollstaendig erfolgreichen OpenRouter-Autopiloten,
# findet den exakt zu diesem Lauf gehoerenden PR und prueft dessen Diff erneut.
# Das ist noetig, weil PRs des eingebauten GITHUB_TOKEN absichtlich keine
# weiteren pull_request-Workflows ausloesen.

on:
  workflow_run:
    workflows: ['OpenRouter Autopilot']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    name: Scope und Gates verifizieren
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Der Job wartet jetzt auf die Pruefungen des PRs. Ohne Deckel wuerde er
    # im Fehlerfall bis zur GitHub-Vorgabe von sechs Stunden stehen.
    timeout-minutes: 25
    steps:
      # Der Rahmen wird GELESEN, nicht abgeschrieben.
      #
      # Bis zum 15.08. stand die Dateiliste hier ein zweites Mal, von Hand
      # gepflegt. Beim Weiten des Rahmens auf 15 Dateien (Schritt 2) wurde nur
      # scripts/lib/sichere-dateien.mjs erweitert — diese Kopie blieb bei 13.
      # Folge waere gewesen: haette der Autopilot den Radar oder die Demo-Daten
      # angefasst, haette der Auto-Merge den eigenen, regelkonformen PR als
      # "nicht freigegeben" abgewiesen, das Label entfernt und den Lauf rot
      # gemacht. Eine Kopie einer Sicherheitsliste driftet immer; die Frage ist
      # nur, in welche Richtung sie beim naechsten Mal driftet.
      #
      # Ausdruecklich `ref: main`: die Liste muss aus dem vertrauenswuerdigen
      # Branch kommen, niemals aus dem PR — sonst koennte ein Patch seinen
      # eigenen Rahmen weiten. Dass der ausloesende Lauf von main stammt, wird
      # unten zusaetzlich geprueft.
      - name: Rahmen aus main laden
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/lib/sichere-dateien.mjs
          sparse-checkout-cone-mode: false

      - name: Sicheren Autopilot-PR ausliefern
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (run.head_branch !== 'main' || run.head_repository?.full_name !== `${owner}/${repo}`) {
              core.notice('Der erfolgreiche Lauf stammt nicht vom main-Branch dieses Repositories.');
              return;
            }

            const { data: openPulls } = await github.rest.pulls.list({
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });
            const runMarker = `/actions/runs/${run.id}`;
            const candidates = openPulls.filter((item) =>
              item.head.ref.startsWith('openrouter/auto-')
                && item.head.repo.full_name === `${owner}/${repo}`
                && (item.body || '').includes(runMarker));
            if (candidates.length !== 1) {
              core.notice(`Kein eindeutiger Autopilot-PR fuer Lauf ${run.id}: ${candidates.length}`);
              return;
            }

            const pull_number = candidates[0].number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const labels = new Set((pr.labels || []).map((x) => x.name));

            if (pr.draft || !labels.has('openrouter-autonomous')
                || !pr.head.ref.startsWith('openrouter/auto-')
                || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.notice(`PR #${pull_number} ist kein auslieferbarer Autopilot-PR.`);
              return;
            }

            // Einzige Quelle des Rahmens — dieselbe Datei, die Autopilot und
            // Auftragsstrom benutzen.
            const { SICHERE_DATEIEN } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/lib/sichere-dateien.mjs`);
            const safeSources = new Set(Object.keys(SICHERE_DATEIEN));
            // Eine leere Liste wuerde jeden PR durchwinken, weil `forbidden`
            // dann trivial leer ist. Lieber laut scheitern als still oeffnen —
            // dieses Projekt hatte schon einen Waechter, der wegen einer
            // leeren Quelle immer gruen war.
            if (safeSources.size < 5) {
              core.setFailed(`Rahmen nicht geladen (${safeSources.size} Dateien) — kein Merge.`);
              return;
            }
            // Erzeugte Dateien: nicht vom Modell geschrieben, sondern von
            // einem Skript aus geprueften Quellen abgeleitet.
            //
            // `assets/eb-auftragsstrom.json` kam am 14.08. dazu und hat den
            // Autopiloten seitdem lahmgelegt: `create-pull-request` committet
            // alles, was gegen `base` abweicht, und der Auto-Merge kannte die
            // Datei nicht. Ergebnis war fuenfmal derselbe Abbruch am selben
            // PR — "nicht freigegeben: assets/eb-auftragsstrom.json" — und ein
            // gruener PR, der tagelang offen lag. Die Autonomie hielt einen
            // Schritt vor dem Ziel an, und der Grund stand nur in einem
            // Kommentar auf dem PR.
            //
            // Ein Modell kann diese Datei nicht faelschen: sie faellt nicht
            // unter die Dateien, die ein Patch anfassen darf, und
            // `auftragsstrom.mjs --check` prueft im PR-Check Herkunft und
            // Rahmen jedes Eintrags.
            const generated = new Set(['app.js', 'assets/eb-auftragsstrom.json']);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            const sourceFiles = files.filter((f) => safeSources.has(f.filename));
            const forbidden = files.filter((f) => !safeSources.has(f.filename) && !generated.has(f.filename));
            const tooLarge = files.reduce((sum, f) => sum + f.additions + f.deletions, 0) > 700;
            const destructive = files.some((f) => !['modified'].includes(f.status));

            if (!sourceFiles.length || forbidden.length || tooLarge || destructive) {
              const reason = [
                forbidden.length ? `nicht freigegeben: ${forbidden.map((f) => f.filename).join(', ')}` : null,
                tooLarge ? 'Diff groesser als 700 Zeilen inklusive app.js-Regenerierung' : null,
                destructive ? 'Datei neu, geloescht oder umbenannt' : null,
              ].filter(Boolean).join('; ');
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: `⛔ **Auto-Merge gestoppt:** ${reason || 'keine freigegebene Quelldatei'}.`,
              });
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pull_number, name: 'openrouter-autonomous',
              }).catch(() => {});
              core.setFailed(`Autopilot-Scope verletzt: ${reason}`);
              return;
            }

            // ── Erst die Pruefungen des PRs, dann der Merge ─────────────
            //
            // Genau hier lag der Fehler. Der Auto-Merge startet drei Sekunden
            // nach dem Autopiloten und rief `pulls.merge` neun Sekunden
            // spaeter. Die Pruefungen des PRs liefen da noch, und GitHubs
            // Branch-Schutz lehnte ab:
            //
            //   HttpError: Repository rule violations found
            //   Required status check "PR Check / PR-Validierung
            //   (pull_request)" is expected.
            //
            // Bei #204 am 25.08.: Autopilot fertig 20:26:12, Merge-Versuch
            // 20:26:24, E2E-Suite fertig erst 20:30:56. Der Versuch konnte
            // nicht gelingen, es gab keinen zweiten, und der Grund stand nur
            // im Log eines Workflows, den niemand ansieht. Der PR lag danach
            // zehn Stunden gruen und ungemerged da.
            //
            // NICHT genommen: GitHubs eingebautes Auto-Merge. Es waere
            // eleganter, aber dann fuehrt GITHUB den Merge aus — und der
            // loest wiederum keinen Push-Workflow aus. Der Deploy unten
            // wuerde nie starten, und der PR waere zwar drin, die Aenderung
            // aber nie live. Ein Fortschritt, der eine neue stille Luecke
            // aufmacht, ist keiner.
            const sha = pr.head.sha;
            const schlafen = (ms) => new Promise((r) => setTimeout(r, ms));
            const FRIST = Date.now() + 15 * 60 * 1000;
            let laufend = [];
            let rot = [];
            let gesehen = 0;
            while (Date.now() < FRIST) {
              const { data: cr } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100,
              });
              gesehen = cr.check_runs.length;
              laufend = cr.check_runs.filter((c) => c.status !== 'completed');
              // Strenger als der Branch-Schutz, und das mit Absicht: hier
              // wird Code ohne menschliche Durchsicht gemerged. Ein roter
              // Check, den die Regel nicht verlangt, ist trotzdem ein Grund
              // stehenzubleiben.
              rot = cr.check_runs.filter((c) => c.status === 'completed'
                && !['success', 'neutral', 'skipped'].includes(c.conclusion));
              if (gesehen && !laufend.length) break;
              await schlafen(15000);
            }

            if (!gesehen || laufend.length || rot.length) {
              const grund = !gesehen
                ? 'keine einzige Pruefung am PR gefunden'
                : laufend.length
                  ? `Pruefungen noch nicht fertig: ${laufend.map((c) => c.name).join(', ')}`
                  : `Pruefung rot: ${rot.map((c) => `${c.name} (${c.conclusion})`).join(', ')}`;
              // Sichtbar am PR, nicht nur im Log. Dass der Grund nur im Log
              // stand, ist der Teil dieses Fehlers, der zehn Stunden gekostet
              // hat.
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: `⛔ **Auto-Merge gestoppt:** ${grund}.`,
              });
              core.setFailed(`Kein Merge — ${grund}.`);
              return;
            }

            const merged = await github.rest.pulls.merge({
              owner, repo, pull_number,
              merge_method: 'squash',
              commit_title: `${pr.title} (#${pull_number})`,
              commit_message: `Vier OpenRouter-Rollen, Syntax-Gates, Katalog-Gates und die komplette Playwright-Suite waren in Lauf ${run.id} gruen.`,
            });
            if (!merged.data.merged) {
              core.setFailed(`GitHub hat den Merge abgelehnt: ${merged.data.message}`);
              return;
            }
            // Ein Merge mit GITHUB_TOKEN loest aus Absicht keinen push-Workflow
            // aus. Deshalb den bestehenden, unveraenderten Deploy explizit auf
            // dem jetzt aktualisierten main-Branch starten.
            let mainReady = false;
            for (let attempt = 0; attempt < 10; attempt += 1) {
              const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (main.commit.sha === merged.data.sha) {
                mainReady = true;
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (!mainReady) {
              core.setFailed('Merge ist erfolgt, aber main zeigt noch nicht auf den Merge-Commit; Deploy nicht gestartet.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'ionos-deploy.yml', ref: 'main',
            });
            core.notice(`Autopilot-PR #${pull_number} gemerge't; IONOS-Deploy wurde explizit gestartet.`);
