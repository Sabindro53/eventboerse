name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deploy to IONOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Minify assets (#6 Part 2)
        run: |
          node scripts/build-protected-hq.mjs
          # WICHTIG: Versionen GEPINNT. 'npx --yes terser' (ohne Pin) zog bei
          # jedem Deploy die neueste Version — ein Minifier-Update kann aus
          # identischem Quellcode plötzlich kaputtes JS erzeugen und die Seite
          # lahmlegen (passiert am 2026-06-24). Bei Updates: Version hier
          # bewusst anheben und vorher testen.
          echo "Vorher: app.js $(wc -c < app.js) B, styles.css $(wc -c < styles.css) B"
          npx --yes terser@5.48.0 app.js --compress --mangle -o app.js
          # Gate 1: gültiges JS?
          node --check app.js
          # Gate 2: Inline-Handler-Globals noch da? (mangle.toplevel=false -> ja)
          for fn in navigateTo toggleFavorite sendMessage filterListings _startChatPoll; do
            grep -q "function $fn" app.js || { echo "FATAL: $fn fehlt nach Minify - Abbruch"; exit 1; }
          done
          # CSS (csso-cli, gepinnt). Fehler ist NICHT fatal — unminifiziertes
          # CSS bricht die Seite nicht, deshalb Deploy nicht abbrechen.
          # csso-cli (CLI-Paket) max. 4.0.2 — "5.0.5" war die Version der csso-LIB,
          # die das CLI ausgibt. Pin auf 5.0.5 existierte nicht → CSS lief unminifiziert.
          #
          # --no-restructure ist PFLICHT: csso zieht sonst Deklarationen zwischen
          # Regeln um und schiebt dabei die `background`-Kurzform HINTER
          # `background-clip: text`. Die Kurzform setzt background-clip zurück →
          # Verlaufsschrift (Hero-Headline, KI-Funken) wird als massiver Farbblock
          # gerendert. Lokal unauffällig, nur in Produktion sichtbar.
          npx --yes csso-cli@4.0.2 --no-restructure styles.css -o styles.css || echo "⚠️ csso-cli fehlgeschlagen — deploye unminifiziertes styles.css"
          # Gate: Verlaufsschrift muss nach dem Minify intakt sein.
          if ! grep -q 'background-clip:text' styles.css; then
            echo "FATAL: background-clip:text nach Minify verloren - Abbruch"; exit 1;
          fi
          echo "Nachher: app.js $(wc -c < app.js) B, styles.css $(wc -c < styles.css) B"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via SFTP
        env:
          SFTP_PASS: ${{ secrets.IONOS_FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.IONOS_FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.IONOS_FTP_SERVER }}
        run: |
          DEPLOY_DIR="/public/wp-content/themes/eventboerse/"
          echo "Deploying to sftp://$SFTP_HOST → $DEPLOY_DIR"
          echo "Local styles.css: $(wc -c < styles.css) bytes"
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:timeout 60;
            set net:max-retries 3;
            mirror --reverse --verbose --delete --ignore-time --transfer-all \
              -x '^\.git' -x '^\.github/' -x '^\.vscode/' -x '^\.idea/' \
              -x '^\.obsidian/' -x '^\.claude/' -x '^\.claude\.json$' \
              -x '^vault/' -x '^docs/' -x '^tests/' -x '^node_modules/' \
              -x '^scripts/' -x '^hq\.html$' \
              -x '^js/modules/' -x '^build-app-js\.sh$' \
              -x '^native/' \
              -x '^assets/eb-arbeit\.json$' -x '^assets/eb-codeflow\.json$' \
              -x '^assets/eb-auftragsstrom\.json$' \
              -x '^assets/eb-rechtsunterlagen\.json$' -x '^assets/eb-rechtsunterlagen-katalog\.json$' -x '^assets/eb-rechtsquellen\.json$' \
              -x '^package\.json$' -x '^package-lock\.json$' -x '^playwright\.config\.js$' \
              -x '^LICENSE$' -x '^README\.md$' -x '^CNAME$' -x '^AGENTS\.md$' \
              -x '^SECURITY\.md$' \
              -x '^\.gitignore$' -x '^\.gitattributes$' -x '^\.editorconfig$' \
              -x '^\.env' \
              -x '^sftp-debug\.txt$' -x '^deploy-probe\.txt$' \
              -x '\.bak$' -x '\.log$' -x '\.swp$' -x '\.DS_Store$' \
              -x '^Attached Element Context' \
              . $DEPLOY_DIR;
            rm -f ${DEPLOY_DIR}hq.html;
            rm -f ${DEPLOY_DIR}assets/eb-rechtsunterlagen.json;
            rm -f ${DEPLOY_DIR}assets/eb-rechtsunterlagen-katalog.json;
            rm -f ${DEPLOY_DIR}assets/eb-rechtsquellen.json;
            echo '--- Deploy complete ---';
            bye
          "

      - name: Inject SMTP credentials into wp-config.php
        env:
          SFTP_PASS: ${{ secrets.IONOS_FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.IONOS_FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.IONOS_FTP_SERVER }}
          SMTP_USER: ${{ secrets.EB_SMTP_USER }}
          SMTP_PASS: ${{ secrets.EB_SMTP_PASS }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            echo "⚠️ SMTP secrets not set, skipping wp-config injection"
            exit 0
          fi
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            get /public/wp-config.php -o /tmp/wp-config.php;
            bye
          "
          echo "--- wp-config.php first 10 lines ---"
          head -n 10 /tmp/wp-config.php
          echo "--- grep EB_SMTP ---"
          grep -n 'EB_SMTP' /tmp/wp-config.php || echo "(not found)"
          # Remove any existing EB_SMTP lines (duplicates from previous deploys)
          sed -i '/EB_SMTP_USER/d' /tmp/wp-config.php
          sed -i '/EB_SMTP_PASS/d' /tmp/wp-config.php
          sed -i '/Eventb.*SMTP Config/d' /tmp/wp-config.php
          # Insert after first line that contains <?php
          LINENUM=$(grep -n '<?php' /tmp/wp-config.php | head -1 | cut -d: -f1)
          if [ -z "$LINENUM" ]; then
            echo "ERROR: <?php not found in wp-config.php!"
            exit 1
          fi
          sed -i "${LINENUM}a\\
          define('EB_SMTP_USER', '${SMTP_USER}');\\
          define('EB_SMTP_PASS', '${SMTP_PASS}');" /tmp/wp-config.php
          echo "--- verify injection ---"
          grep -n 'EB_SMTP' /tmp/wp-config.php
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            put /tmp/wp-config.php -o /public/wp-config.php;
            bye
          "
          echo "✅ SMTP constants written to wp-config.php"
          rm -f /tmp/wp-config.php

      - name: Inject Stripe credentials into wp-config.php
        env:
          SFTP_PASS: ${{ secrets.IONOS_FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.IONOS_FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.IONOS_FTP_SERVER }}
          STRIPE_MODE: ${{ secrets.EB_STRIPE_MODE || vars.EB_STRIPE_MODE }}
          STRIPE_PUBLIC_KEY: ${{ secrets.EB_STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.EB_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.EB_STRIPE_WEBHOOK_SECRET }}
          STRIPE_TEST_PUBLIC_KEY: ${{ secrets.EB_STRIPE_TEST_PUBLIC_KEY || secrets.EB_STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.EB_STRIPE_TEST_SECRET_KEY || secrets.EB_STRIPE_TEST_PRIVATE_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.EB_STRIPE_TEST_WEBHOOK_SECRET }}
        run: |
          RAW_MODE=$(printf "%s" "$STRIPE_MODE" | tr '[:upper:]' '[:lower:]' | tr -d ' _-')
          if [ "$RAW_MODE" = "test" ] || [ "$RAW_MODE" = "testing" ] || [ "$RAW_MODE" = "testmode" ] || [ "$RAW_MODE" = "testmodus" ] || [ "$RAW_MODE" = "sandbox" ] || [ "$RAW_MODE" = "sandboxmode" ]; then
            NORMALIZED_STRIPE_MODE="test"
          else
            NORMALIZED_STRIPE_MODE="live"
          fi

          if { [ -z "$STRIPE_PUBLIC_KEY" ] || [ -z "$STRIPE_SECRET_KEY" ]; } && { [ -z "$STRIPE_TEST_PUBLIC_KEY" ] || [ -z "$STRIPE_TEST_SECRET_KEY" ]; }; then
            echo "⚠️ Stripe secrets not set (live or test public/secret key pair) — skipping"
            exit 0
          fi
          if [ "$NORMALIZED_STRIPE_MODE" = "test" ] && { [ -z "$STRIPE_TEST_PUBLIC_KEY" ] || [ -z "$STRIPE_TEST_SECRET_KEY" ]; }; then
            echo "ERROR: EB_STRIPE_MODE resolves to test, but EB_STRIPE_TEST_PUBLIC_KEY / EB_STRIPE_TEST_SECRET_KEY are missing."
            exit 1
          fi
          if [ "$NORMALIZED_STRIPE_MODE" = "live" ] && [ -n "$STRIPE_TEST_PUBLIC_KEY" ] && [ -n "$STRIPE_TEST_SECRET_KEY" ]; then
            echo "ℹ️ Stripe test keys are present, but EB_STRIPE_MODE is not test/sandbox. Live mode remains active."
          fi

          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            get /public/wp-config.php -o /tmp/wp-config.php;
            bye
          "
          echo "--- grep EB_STRIPE (before) ---"
          grep -n 'EB_STRIPE' /tmp/wp-config.php | sed -E "s/(define\\('EB_STRIPE_[A-Z_]+', ')[^']*/\\1***REDACTED***/" || echo "(not found)"
          # Remove any existing EB_STRIPE_* lines (idempotent re-inject)
          sed -i '/EB_STRIPE_MODE/d' /tmp/wp-config.php
          sed -i '/EB_STRIPE_PUBLIC_KEY/d' /tmp/wp-config.php
          sed -i '/EB_STRIPE_SECRET_KEY/d' /tmp/wp-config.php
          sed -i '/EB_STRIPE_WEBHOOK_SECRET/d' /tmp/wp-config.php
          sed -i '/EB_STRIPE_TEST_PUBLIC_KEY/d' /tmp/wp-config.php
          sed -i '/EB_STRIPE_TEST_SECRET_KEY/d' /tmp/wp-config.php
          sed -i '/EB_STRIPE_TEST_WEBHOOK_SECRET/d' /tmp/wp-config.php
          sed -i '/Eventb.*Stripe Config/d' /tmp/wp-config.php
          LINENUM=$(grep -n '<?php' /tmp/wp-config.php | head -1 | cut -d: -f1)
          if [ -z "$LINENUM" ]; then
            echo "ERROR: <?php not found in wp-config.php!"
            exit 1
          fi
          # Escape single quotes in values for safe PHP single-quoted string literal
          ESC_MODE=$(printf "%s" "$NORMALIZED_STRIPE_MODE" | sed "s/'/\\\\'/g")
          ESC_PK=$(printf "%s" "$STRIPE_PUBLIC_KEY"     | sed "s/'/\\\\'/g")
          ESC_SK=$(printf "%s" "$STRIPE_SECRET_KEY"     | sed "s/'/\\\\'/g")
          ESC_WH=$(printf "%s" "$STRIPE_WEBHOOK_SECRET" | sed "s/'/\\\\'/g")
          ESC_TEST_PK=$(printf "%s" "$STRIPE_TEST_PUBLIC_KEY"     | sed "s/'/\\\\'/g")
          ESC_TEST_SK=$(printf "%s" "$STRIPE_TEST_SECRET_KEY"     | sed "s/'/\\\\'/g")
          ESC_TEST_WH=$(printf "%s" "$STRIPE_TEST_WEBHOOK_SECRET" | sed "s/'/\\\\'/g")
          sed -i "${LINENUM}a\\
          define('EB_STRIPE_MODE', '${ESC_MODE}');\\
          define('EB_STRIPE_PUBLIC_KEY', '${ESC_PK}');\\
          define('EB_STRIPE_SECRET_KEY', '${ESC_SK}');\\
          define('EB_STRIPE_WEBHOOK_SECRET', '${ESC_WH}');\\
          define('EB_STRIPE_TEST_PUBLIC_KEY', '${ESC_TEST_PK}');\\
          define('EB_STRIPE_TEST_SECRET_KEY', '${ESC_TEST_SK}');\\
          define('EB_STRIPE_TEST_WEBHOOK_SECRET', '${ESC_TEST_WH}');" /tmp/wp-config.php
          echo "--- verify injection ---"
          grep -nE 'EB_STRIPE_(MODE|PUBLIC|SECRET|WEBHOOK|TEST_)' /tmp/wp-config.php | sed -E "s/(define\\('EB_STRIPE_[A-Z_]+', ')[^']*/\\1***REDACTED***/"
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            put /tmp/wp-config.php -o /public/wp-config.php;
            bye
          "
          echo "✅ Stripe constants written to wp-config.php"
          rm -f /tmp/wp-config.php

      - name: Inject Apple Team-ID into wp-config.php (optional)
        env:
          SFTP_PASS: ${{ secrets.IONOS_FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.IONOS_FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.IONOS_FTP_SERVER }}
          APPLE_TEAM_ID: ${{ secrets.EB_APPLE_TEAM_ID }}
        run: |
          # Die Team-ID ist KEIN Geheimnis -- sie steht auf jeder ausgelieferten
          # apple-app-site-association und ist damit oeffentlich. Sie liegt hier
          # trotzdem als Secret, weil sie zur BEREITSTELLUNG gehoert und nicht
          # in den Quelltext: beim naechsten Entwicklerkonto waere ein fest
          # eingetragener Wert falsch, und niemand faende die Stelle.
          #
          # Opt-in wie bei den AI-Schluesseln. Ohne das Secret bleibt
          # wp-config.php unveraendert, und die Route liefert weiterhin 404 --
          # der bewusste Zustand "nicht eingerichtet".
          #
          # WARUM DAS WICHTIG IST: Apple holt die Zuordnungsdatei EINMAL beim
          # Installieren ab und merkt sich das Ergebnis. Eine Datei mit einem
          # falschen oder halben Wert faellt deshalb erst beim Nutzer auf, und
          # dann ist sie schon zwischengespeichert.
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "ℹ️ EB_APPLE_TEAM_ID nicht gesetzt — wp-config bleibt unveraendert." >> "$GITHUB_STEP_SUMMARY"
            echo "   /.well-known/apple-app-site-association liefert weiterhin 404 (Absicht)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Apples Format: genau zehn alphanumerische Zeichen. Dieselbe Pruefung
          # wie in eb_apple_app_id(); ein Tippfehler soll hier scheitern und
          # nicht in einer zwischengespeicherten Zuordnung landen.
          if ! printf "%s" "$APPLE_TEAM_ID" | grep -qE '^[A-Za-z0-9]{10}$'; then
            echo "::error::EB_APPLE_TEAM_ID hat nicht Apples Format (10 alphanumerische Zeichen)."
            exit 1
          fi
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            get /public/wp-config.php -o /tmp/wp-config.php;
            bye
          "
          sed -i '/EB_APPLE_TEAM_ID/d' /tmp/wp-config.php
          LINENUM=$(grep -n '<?php' /tmp/wp-config.php | head -1 | cut -d: -f1)
          if [ -z "$LINENUM" ]; then
            echo "ERROR: <?php not found in wp-config.php!"
            exit 1
          fi
          sed -i "${LINENUM}a\\
          define('EB_APPLE_TEAM_ID', '${APPLE_TEAM_ID}');" /tmp/wp-config.php
          echo "--- verify ---"
          grep -n 'EB_APPLE_TEAM_ID' /tmp/wp-config.php
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            put /tmp/wp-config.php -o /public/wp-config.php;
            bye
          "
          rm -f /tmp/wp-config.php
          echo "✅ EB_APPLE_TEAM_ID in wp-config.php geschrieben" >> "$GITHUB_STEP_SUMMARY"
          echo "   Danach pruefen: curl -sSI https://xn--eventbrse-57a.de/.well-known/apple-app-site-association" >> "$GITHUB_STEP_SUMMARY"

      - name: Inject AI keys into wp-config.php (optional)
        env:
          SFTP_PASS: ${{ secrets.IONOS_FTP_PASSWORD }}
          SFTP_USER: ${{ secrets.IONOS_FTP_USERNAME }}
          SFTP_HOST: ${{ secrets.IONOS_FTP_SERVER }}
          ANTHROPIC_KEY: ${{ secrets.EB_ANTHROPIC_API_KEY }}
          OPENAI_KEY: ${{ secrets.EB_OPENAI_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.EB_OPENROUTER_API_KEY }}
        run: |
          # Bewusst OPT-IN. Ohne diese Secrets passiert nichts — ein Schluessel
          # wandert nicht stillschweigend an einen weiteren Ort. Die HQ-Karten
          # melden dann "nicht hinterlegt", was zutrifft.
          #
          # Gesetzt bedeutet: der Schluessel liegt danach auf dem Webserver
          # (wie EB_STRIPE_SECRET_KEY schon heute) und ist damit bei einer
          # Server-Kompromittierung mit betroffen. Dafuer kann das HQ
          # Gueltigkeit und Kontingent serverseitig pruefen, ohne dass der
          # Schluessel je den Browser erreicht.
          if [ -z "$ANTHROPIC_KEY" ] && [ -z "$OPENAI_KEY" ] && [ -z "$OPENROUTER_KEY" ]; then
            echo "ℹ️ Keine AI-Keys als Secrets gesetzt — wp-config bleibt unveraendert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            get /public/wp-config.php -o /tmp/wp-config.php;
            bye
          "
          sed -i '/EB_ANTHROPIC_API_KEY/d' /tmp/wp-config.php
          sed -i '/EB_OPENAI_API_KEY/d'    /tmp/wp-config.php
          sed -i '/EB_OPENROUTER_API_KEY/d' /tmp/wp-config.php
          LINENUM=$(grep -n '<?php' /tmp/wp-config.php | head -1 | cut -d: -f1)
          if [ -z "$LINENUM" ]; then
            echo "ERROR: <?php not found in wp-config.php!"
            exit 1
          fi
          ESC_ANT=$(printf "%s" "$ANTHROPIC_KEY" | sed "s/'/\\\\'/g")
          ESC_OAI=$(printf "%s" "$OPENAI_KEY"    | sed "s/'/\\\\'/g")
          ESC_ORT=$(printf "%s" "$OPENROUTER_KEY" | sed "s/'/\\\\'/g")
          sed -i "${LINENUM}a\\
          define('EB_ANTHROPIC_API_KEY', '${ESC_ANT}');\\
          define('EB_OPENAI_API_KEY', '${ESC_OAI}');\\
          define('EB_OPENROUTER_API_KEY', '${ESC_ORT}');" /tmp/wp-config.php
          echo "--- verify (redacted) ---"
          grep -nE "EB_(ANTHROPIC|OPENAI|OPENROUTER)_API_KEY" /tmp/wp-config.php \
            | sed -E "s/(define\('EB_[A-Z_]+', ')[^']*/\1***REDACTED***/"
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            put /tmp/wp-config.php -o /public/wp-config.php;
            bye
          "
          rm -f /tmp/wp-config.php
          echo "✅ AI keys written to wp-config.php" >> "$GITHUB_STEP_SUMMARY"
